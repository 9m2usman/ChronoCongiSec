# Alembic configuration for AMSC (Owner: M6).
#
# Run from the repository root:
#   alembic -c backend/alembic.ini upgrade head
#
# The database URL is NOT stored here. env.py resolves it from (in order):
#   1. config.attributes["database_url"] (used by tests)
#   2. the DATABASE_URL environment variable
#   3. backend.app.core.config Settings.DATABASE_URL

[alembic]
script_location = %(here)s/alembic
# Repository root on sys.path so 'backend.app...' imports resolve.
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
