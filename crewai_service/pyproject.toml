[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronocognisec-crewai-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["crewai_service*"]
