name: AMSC Continuous Integration & Security Assurance

on:
  push:
    branches: [ main, "feat/**", "fix/**", "docs/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-test:
    name: Backend Unit & Security Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amsc_user
          POSTGRES_PASSWORD: amsc_password
          POSTGRES_DB: amsc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Run Ruff on Changed Backend Python Files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -d '' -t CHANGED_FILES < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- backend/app)
          PYTHON_FILES=()
          for file in "${CHANGED_FILES[@]}"; do
            if [[ "$file" == *.py && -f "$file" ]]; then
              PYTHON_FILES+=("$file")
            fi
          done

          if [ "${#PYTHON_FILES[@]}" -eq 0 ]; then
            echo "No changed backend Python files; Ruff check is not applicable to this change."
          else
            ruff check "${PYTHON_FILES[@]}"
          fi

      - name: Run Backend Unit & Security Test Suites
        env:
          APP_ENV: test
          SECRET_KEY: test-ci-secret-key-at-least-32-bytes-long-now
          RATE_LIMIT_HMAC_SECRET: test-hmac-secret-at-least-32-bytes
          DATABASE_URL: postgresql+asyncpg://amsc_user:amsc_password@localhost:5432/amsc_db
          TEST_DATABASE_URL: postgresql+asyncpg://amsc_user:amsc_password@localhost:5432/postgres
          TEST_DATABASE_ALLOWED_HOSTS: localhost
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest backend/tests/security backend/tests/unit backend/app/memory/tests backend/app/knowledge backend/tests/database -v -rsx --durations=10

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.22.2
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Unit Tests (Vitest)
        working-directory: ./frontend
        run: npm test

      - name: Run Frontend Type Check & Production Build
        working-directory: ./frontend
        run: npm run build
