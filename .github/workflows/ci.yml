name: AMSC Continuous Integration & Security Assurance

on:
  push:
    branches: [ main, "feat/**", "fix/**", "docs/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-lint-and-test:
    name: Backend Lint, Tests & DB
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amsc_user
          POSTGRES_PASSWORD: amsc_password
          POSTGRES_DB: amsc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Run Ruff on Backend
        run: ruff check backend/

      - name: Train and Register ML Advisory Baselines
        run: python -m ml.training.train_models

      - name: Run Backend Security Tests
        env:
          APP_ENV: test
          SECRET_KEY: test-ci-secret-key-at-least-32-bytes-long-now
          RATE_LIMIT_HMAC_SECRET: test-hmac-secret-at-least-32-bytes
          DATABASE_URL: postgresql+asyncpg://amsc_user:amsc_password@localhost:5432/amsc_db
          TEST_DATABASE_URL: postgresql+asyncpg://amsc_user:amsc_password@localhost:5432/postgres
          TEST_DATABASE_ALLOWED_HOSTS: localhost
          REDIS_URL: redis://localhost:6379/0
        run: pytest backend/tests/security -v -rsx

      - name: Run Backend Unit Tests
        env:
          APP_ENV: test
          SECRET_KEY: test-ci-secret-key-at-least-32-bytes-long-now
          RATE_LIMIT_HMAC_SECRET: test-hmac-secret-at-least-32-bytes
          DATABASE_URL: postgresql+asyncpg://amsc_user:amsc_password@localhost:5432/amsc_db
          TEST_DATABASE_URL: postgresql+asyncpg://amsc_user:amsc_password@localhost:5432/postgres
          TEST_DATABASE_ALLOWED_HOSTS: localhost
          REDIS_URL: redis://localhost:6379/0
        run: pytest backend/tests/unit backend/app/memory/tests backend/app/knowledge -v -rsx

      - name: Run Database Integration Tests
        env:
          APP_ENV: test
          SECRET_KEY: test-ci-secret-key-at-least-32-bytes-long-now
          RATE_LIMIT_HMAC_SECRET: test-hmac-secret-at-least-32-bytes
          DATABASE_URL: postgresql+asyncpg://amsc_user:amsc_password@localhost:5432/amsc_db
          TEST_DATABASE_URL: postgresql+asyncpg://amsc_user:amsc_password@localhost:5432/postgres
          TEST_DATABASE_ALLOWED_HOSTS: localhost
          REDIS_URL: redis://localhost:6379/0
        run: pytest backend/tests/database -v -rsx

  crewai-tests:
    name: CrewAI Agent Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CrewAI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crewai_service/requirements.txt

      - name: Run CrewAI Tests
        run: pytest crewai_service/tests -v -rsx

  frontend-check:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Run Frontend Type Check & Production Build
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Images
        run: docker compose build

      - name: Validate Compose Config
        run: docker compose config --quiet