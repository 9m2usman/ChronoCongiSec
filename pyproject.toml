[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronocongisec"
version = "0.1.0"
description = "Research-driven AI agent security and governance control plane"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Enforce stable correctness rules on changed backend files. The repository-wide
# Ruff 0.17 default set currently reports 1,478 legacy style/modernization findings.
# Expand this baseline deliberately as existing findings are resolved.
select = ["E4", "E7", "E9", "F"]
